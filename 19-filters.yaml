- name: Demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Ansible, DevOps, Automation"
    names:
      - Janardhan
      - Rao
      - Velagaleti
    topic: "ANSIBLE"
  tasks:
    - name: Print the name
      debug:
        msg: "Person Name: {{ person_name | default('Janardhan') }}"
    - name: Print topics
      debug:
        msg: "Topics are {{ topics.split(', ') }}"
    - name: Print names
      debug:
        msg: "Names are {{ names | join(', ') }}"
    - name: Print topic
      debug:
        msg: "Topic in lower case: {{ topic | lower }}"