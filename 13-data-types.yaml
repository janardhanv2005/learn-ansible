- name: Course Information
  hosts: local
  connection: local
  vars:
    course: "AI Ops with dev sec ops"
    instructor: "John Doe"
    duration_in_hours: 150
    is_live_session: true
    topics:
      - "Ansible"
      - "Docker"
      - "Kubernetes"
      - "CI/CD"
    more_details:
      trainer: "John Doe"
      months: 4.5
  tasks:
  - name: Print info and type
    debug:
      msg: |
        Course: {{ course }}, Type: {{ course | type }}
        Instructor: {{ instructor }}, Type: {{ instructor | type }}
        Duration: {{ duration_in_hours }}, Type: {{ duration_in_hours | type }}
        Is Live Session: {{ is_live_session }}, Type: {{ is_live_session | type }}
        Topics: {{ topics }}, Type: {{ topics | type }}
        More Details: {{ more_details }}, Type: {{ more_details | type }}