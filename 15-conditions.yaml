- name: Print OS is Redhat or not
  hosts: local
  connection: local
  become: true
  tasks:
    - name: nstall nginx on Redhat
      dnf:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == "RedHat"
    - name: Install nginx on Ubuntu
      apt:
        name: nginx
        state: present
      when: ansible_facts['os_family'] == "Debian"