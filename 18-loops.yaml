- name: Install Packages using loops
  hosts: local
  connection: local
  become: true
  vars:
    packages:
      - {name: nginx, state: absent}
      - {name: mysql, state: present}
      - {name: net-tools, state: present}
      - {name: git, state: present}
      - {name: htop, state: absent
  tasks:
    - name: Install multiple packages
      package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop: "{{ packages }}"