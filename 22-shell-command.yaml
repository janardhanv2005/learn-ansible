- name: shell command demo
  hosts: local
  connection: local
  tasks:
    - name: run shell command
      # command: cat /etc/passwd | grep ec2-user
      shell: cat /etc/passwd | grep ec2-user
      register: shell_command_output

    - name: print shell command output
      debug:
        msg: "{{ shell_command_output.stdout }}"
    - name: get the files information
      # command: ls -la > /tmp/files_info.txt
      shell: ls -l > /tmp/files_info.txt
      register: file_info

    - name: print files information
      debug:
        msg: "{{ file_info.stdout }}"